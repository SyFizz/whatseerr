# Example deployment. Copy to compose.yaml, create `.env` from `.env.example`, then:
#   docker compose up -d && docker compose logs -f whatseerr
services:
  whatseerr:
    # `1` follows the latest 1.x release; pin e.g. `1.0.0` for fully reproducible deployments.
    image: ghcr.io/syfizz/whatseerr:1
    container_name: whatseerr
    restart: unless-stopped
    env_file: .env
    volumes:
      # WhatsApp session (keep it private: it grants full access to the account)
      - whatseerr-data:/data
    # Only needed if Seerr is not on the same Docker network (prefer a private address):
    # ports:
    #   - "8080:8080"

volumes:
  whatseerr-data:
